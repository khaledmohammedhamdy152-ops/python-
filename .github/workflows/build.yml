name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: pip install "flet>=1.0.0,<1.1"

      - name: Build APK
        run: yes | flet build apk -v

      - uses: actions/upload-artifact@v4
        with:
          name: python-editor-apk
          path: build/apk
