name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: pip install "flet>=1.0.0,<1.1"

      - name: Install NDK and CMake (with retry)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for pkg in "ndk;28.2.13676358" "cmake;3.22.1"; do
            for i in 1 2 3; do
              yes | "$SDKM" "$pkg" && break
              echo "retry $i for $pkg"; sleep 5
            done
          done

      - name: Make Gradle sequential
        run: |
          mkdir -p ~/.gradle
          printf "org.gradle.parallel=false\norg.gradle.workers.max=1\n" >> ~/.gradle/gradle.properties

      - name: Build APK
        run: yes | flet build apk --arch arm64-v8a -v

      - uses: actions/upload-artifact@v4
        with:
          name: python-editor-apk
          path: build/apk
